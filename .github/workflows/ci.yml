name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore & build backend
        run: dotnet build backend/Skarb.Api -c Release -v q

      - name: Backend tests
        run: dotnet test backend/Skarb.Api.Tests -c Release -v q

      - name: Install & typecheck & build frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npm run build
