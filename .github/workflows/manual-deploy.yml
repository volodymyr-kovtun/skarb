name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        type: string
        default: main

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Backend tests
        # SkipSpa: the SPA is typechecked above and built for real in the Docker image.
        run: dotnet test backend/Skarb.Api.Tests --nologo -p:SkipSpa=true

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    outputs:
      ghcr_repository: ${{ steps.meta.outputs.ghcr_repository }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Prepare image metadata
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          repository_lower="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_repository=${repository_lower}" >> "$GITHUB_OUTPUT"
          echo "image_tag=production" >> "$GITHUB_OUTPUT"
          echo "image_tag_sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.ghcr_repository }}/app:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.meta.outputs.ghcr_repository }}/app:${{ github.sha }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Sync deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          overwrite: true
          source: compose.production.yml,compose.ghcr.yml
          target: ${{ vars.DEPLOY_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_REPOSITORY: ${{ needs.build.outputs.ghcr_repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          timeout: 60s
          command_timeout: 15m
          envs: DEPLOY_PATH,GHCR_REPOSITORY,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -Eeuo pipefail

            cd "${DEPLOY_PATH}"

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            COMPOSE="docker compose --project-name skarb --env-file .env.production -f compose.production.yml -f compose.ghcr.yml"

            ${COMPOSE} pull app
            ${COMPOSE} up -d --no-build
            ${COMPOSE} ps

            set -a
            . ./.env.production
            set +a

            app_url="${APP_BASE_URL:-https://skarb.subero.app}"

            for attempt in $(seq 1 20); do
              status_code="$(curl -ksS -o /dev/null -w '%{http_code}' "${app_url}/" || true)"
              if [ "${status_code}" = "200" ]; then
                echo "Health check passed via ${app_url}/"
                break
              fi

              if [ "${attempt}" = "20" ]; then
                echo "Health check failed via ${app_url}/ (last status: ${status_code})" >&2
                exit 1
              fi

              sleep 5
            done

            echo "Pruning old Docker images..."
            docker image prune -f
